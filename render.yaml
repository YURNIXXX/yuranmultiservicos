# ============================================================
# CONFIGURAÇÃO DO RENDER
# Depois de colocar o projeto no GitHub, o Render pode usar
# este arquivo para criar automaticamente o Web Service.
# ============================================================
services:
  - type: web
    name: yuranmultiservicos
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_RECOVERY_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: uploads
      - key: SUPABASE_VERIFICATION_BUCKET
        value: verification-documents
      - key: PUBLIC_BASE_URL
        sync: false
      - key: IDENTITY_RETENTION_DAYS
        value: 30
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
