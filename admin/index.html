<!doctype html><html lang="pt"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login | Yuran Multicerviços</title><link rel="stylesheet" href="/admin/admin.css"></head><body>
<section class="login-wrap"><div class="login-stack"><form class="panel login-panel" id="loginForm"><span class="eyebrow">YURAN MULTICERVIÇOS</span><h1>Painel do site</h1><p>Entre para gerir o conteúdo do site.</p><input type="password" name="password" placeholder="Senha de administrador" required><button type="submit">Entrar</button><button class="text-button" type="button" id="showRecovery">Esqueci a senha</button><small id="loginError"></small></form><form class="panel login-panel" id="recoveryForm" hidden><span class="eyebrow">RECUPERAÇÃO</span><h2>Definir nova senha</h2><p>Informe a chave <b>ADMIN_RECOVERY_KEY</b> configurada no Render e escolha uma nova senha.</p><input type="password" name="recoveryKey" placeholder="Chave de recuperação" required><input type="password" name="newPassword" minlength="8" placeholder="Nova senha (mín. 8 caracteres)" required><input type="password" name="confirmPassword" minlength="8" placeholder="Confirmar nova senha" required><button type="submit">Redefinir senha</button><button class="text-button" type="button" id="backLogin">Voltar ao login</button><small id="recoveryError"></small></form></div></section>
<script>const login=document.querySelector('#loginForm'),rec=document.querySelector('#recoveryForm'),err=document.querySelector('#loginError'),rerr=document.querySelector('#recoveryError');fetch('/api/admin/session').then(r=>r.json()).then(s=>{if(s.authenticated)location.replace('/admin/dashboard.html')});document.querySelector('#showRecovery').onclick=()=>{login.hidden=true;rec.hidden=false};document.querySelector('#backLogin').onclick=()=>{rec.hidden=true;login.hidden=false};login.onsubmit=async ev=>{ev.preventDefault();err.textContent='';const r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(login)))});const j=await r.json().catch(()=>({}));if(!r.ok){err.textContent=j.error||'Não foi possível entrar.';return;}location.replace('/admin/dashboard.html');};rec.onsubmit=async ev=>{ev.preventDefault();rerr.textContent='';const v=Object.fromEntries(new FormData(rec));if(v.newPassword!==v.confirmPassword){rerr.textContent='As duas senhas não coincidem.';return;}const r=await fetch('/api/admin/recover-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({recoveryKey:v.recoveryKey,newPassword:v.newPassword})});const j=await r.json().catch(()=>({}));if(!r.ok){rerr.textContent=j.error||'Não foi possível recuperar a senha.';return;}alert('Senha redefinida. Agora pode entrar com a nova senha.');rec.reset();rec.hidden=true;login.hidden=false;};</script></body></html>
