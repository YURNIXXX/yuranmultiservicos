<!doctype html><html lang="pt"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login | MultiServiços</title><link rel="stylesheet" href="/admin/admin.css"></head><body>
<section class="login-wrap"><form class="panel login-panel" id="loginForm"><span class="eyebrow">ADMINISTRAÇÃO</span><h1>Painel do site</h1><p>Entre para gerir o conteúdo do site.</p><input type="password" name="password" placeholder="Senha de administrador" required><button type="submit">Entrar</button><small id="loginError"></small></form></section>
<script>const f=document.querySelector('#loginForm'),e=document.querySelector('#loginError');fetch('/api/admin/session').then(r=>r.json()).then(s=>{if(s.authenticated)location.replace('/admin/dashboard.html')});f.onsubmit=async ev=>{ev.preventDefault();e.textContent='';const r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(f)))});const j=await r.json().catch(()=>({}));if(!r.ok){e.textContent=j.error||'Não foi possível entrar.';return;}location.replace('/admin/dashboard.html');};</script></body></html>
